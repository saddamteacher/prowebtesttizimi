<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProWeb Testing System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="files/logo uzb.png" alt="ProWeb" id="main-logo" style="height: 40px; transition: opacity 0.3s ease;">
        </div>
        <div class="lang-switcher">
            <button id="lang-uz-btn" class="lang-btn active">UZB</button>
            <button id="lang-ru-btn" class="lang-btn">RU</button>
        </div>
    </header>

    <main>
        <h1 class="page-title" id="page-title">Yo'nalishni tanlang</h1>
        <p class="page-subtitle" id="page-subtitle">O'zingizga mos yo'nalishni tanlang va testni boshlang</p>

        <div class="cards-grid" id="subjects-container">
            <!-- Cards will be generated by JS -->
        </div>
    </main>

    <script src="questions_seed.js"></script>
    <script src="questions_sheets.js"></script>
    <script src="script.js"></script>
</body>
</html>
