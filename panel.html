<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProWeb — Boshqaruv paneli</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
:root{
  --bg:#0a0a0f;
  --surface:#111118;
  --surface2:#18181f;
  --border:rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.12);
  --text:#f1f1f3;
  --text2:rgba(241,241,243,0.55);
  --text3:rgba(241,241,243,0.3);
  --accent:#6366f1;
  --accent-hover:#5254cc;
  --accent-soft:rgba(99,102,241,0.12);
  --green:#22c55e;
  --green-soft:rgba(34,197,94,0.1);
  --red:#ef4444;
  --red-soft:rgba(239,68,68,0.1);
  --radius:12px;
  --radius-sm:8px;
}
body{background:var(--bg);color:var(--text);min-height:100vh}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:99px}

/* ── PIN LOGIN ─────────────────────────────────────── */
#login-page{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(99,102,241,0.08),transparent 60%),var(--bg);
}
.login-card{
  width:100%;max-width:360px;padding:40px 36px;
  background:var(--surface);border:1px solid var(--border2);
  border-radius:20px;text-align:center;
  box-shadow:0 0 0 1px rgba(255,255,255,0.04) inset,0 32px 80px rgba(0,0,0,0.6);
}
.login-logo{font-size:1.3rem;font-weight:800;letter-spacing:-0.5px;margin-bottom:28px;color:var(--text)}
.login-logo span{color:var(--accent)}
.pin-dots{display:flex;justify-content:center;gap:14px;margin-bottom:32px}
.pin-dot{width:12px;height:12px;border-radius:50%;background:var(--border2);transition:all 0.25s cubic-bezier(0.34,1.56,0.64,1)}
.pin-dot.filled{background:var(--accent);box-shadow:0 0 12px rgba(99,102,241,0.5);transform:scale(1.2)}
.pin-dot.shake{animation:shake 0.4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:240px;margin:0 auto}
.pin-btn{
  padding:18px;font-size:1.2rem;font-weight:600;color:var(--text);
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);
  cursor:pointer;transition:all 0.15s ease;user-select:none;
}
.pin-btn:hover{background:#22222c;border-color:var(--border2);transform:translateY(-1px)}
.pin-btn:active{transform:scale(0.94)}
.pin-del{color:var(--red);font-size:1rem}
.pin-ok{color:var(--green);font-size:1.3rem}
#pin-error{color:var(--red);font-size:0.8rem;margin-top:16px;min-height:18px}

/* ── MAIN LAYOUT ────────────────────────────────────── */
#app{display:none;min-height:100vh}

/* Topbar */
.topbar{
  height:56px;display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;
}
.topbar-logo{font-size:1rem;font-weight:800;letter-spacing:-0.3px}
.topbar-logo span{color:var(--accent)}
.topbar-badge{
  font-size:0.65rem;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;
  padding:3px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);
  margin-left:8px;
}
.topbar-right{display:flex;align-items:center;gap:8px}
.btn-sm{
  padding:7px 14px;font-size:0.78rem;font-weight:600;border-radius:var(--radius-sm);
  border:1px solid var(--border2);background:transparent;color:var(--text2);
  cursor:pointer;transition:all 0.2s;
}
.btn-sm:hover{background:var(--surface2);color:var(--text)}
.btn-danger-sm{border-color:rgba(239,68,68,0.2);color:var(--red)}
.btn-danger-sm:hover{background:var(--red-soft);color:var(--red);border-color:rgba(239,68,68,0.3)}

/* Main content */
.main{padding:24px;max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* ── STATS ROW ──────────────────────────────────────── */
.stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.stat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;
}
.stat-label{font-size:0.72rem;font-weight:600;color:var(--text3);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:8px}
.stat-value{font-size:1.6rem;font-weight:800;letter-spacing:-0.5px;color:var(--text)}
.stat-value.accent{color:var(--accent)}

/* ── SECTION CARD ───────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card-title{font-size:0.72rem;font-weight:700;color:var(--text3);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:14px}

/* Language tabs */
.lang-tabs{display:flex;gap:4px;background:var(--surface2);padding:3px;border-radius:var(--radius-sm);width:fit-content}
.lang-tab{padding:6px 16px;font-size:0.82rem;font-weight:600;border:none;background:transparent;color:var(--text3);border-radius:6px;cursor:pointer;transition:all 0.2s}
.lang-tab.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(99,102,241,0.4)}

/* ── SUBJECT GRID ───────────────────────────────────── */
.subject-grid{display:flex;flex-wrap:wrap;gap:6px}
.subject-chip{
  padding:7px 12px;font-size:0.8rem;font-weight:500;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius-sm);color:var(--text2);cursor:pointer;
  transition:all 0.2s;display:flex;align-items:center;gap:6px;
}
.subject-chip:hover{border-color:var(--border2);color:var(--text)}
.subject-chip.active{background:var(--accent-soft);border-color:rgba(99,102,241,0.35);color:var(--accent);font-weight:600}
.chip-count{
  font-size:0.65rem;font-weight:700;
  background:rgba(255,255,255,0.1);color:inherit;
  padding:1px 6px;border-radius:99px;
}
.subject-chip.active .chip-count{background:rgba(99,102,241,0.25)}

/* ── BLOCK TABS ─────────────────────────────────────── */
.block-tabs{display:flex;flex-wrap:wrap;gap:4px}
.block-tab{
  padding:6px 14px;font-size:0.78rem;font-weight:500;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius-sm);color:var(--text3);cursor:pointer;transition:all 0.2s;
  display:flex;align-items:center;gap:5px;
}
.block-tab:hover{border-color:var(--border2);color:var(--text2)}
.block-tab.active{background:var(--surface2);border-color:var(--accent);color:var(--accent);font-weight:600}
.block-count{
  font-size:0.65rem;background:var(--accent-soft);color:var(--accent);
  padding:1px 5px;border-radius:99px;font-weight:700;
}

/* Block config */
.block-config{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px}
.block-config label{font-size:0.75rem;color:var(--text3);white-space:nowrap}
.block-config input{
  width:60px;padding:6px 10px;text-align:center;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius-sm);color:var(--text);font-size:0.85rem;outline:none;
}

/* ── TWO COLUMN ─────────────────────────────────────── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.two-col{grid-template-columns:1fr}}

/* ── INPUTS ─────────────────────────────────────────── */
.form-field{margin-bottom:10px}
.form-field label{display:block;font-size:0.72rem;font-weight:600;color:var(--text3);margin-bottom:5px;letter-spacing:0.3px}
.form-field input,
.form-field textarea,
.form-field select{
  width:100%;padding:9px 12px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius-sm);color:var(--text);font-size:0.88rem;outline:none;
  transition:border-color 0.2s;resize:none;
  -webkit-appearance:none;appearance:none;
}
.form-field input:focus,
.form-field textarea:focus,
.form-field select:focus{border-color:rgba(99,102,241,0.5);background:#1a1a25}
.form-field input::placeholder,
.form-field textarea::placeholder{color:var(--text3)}
.form-field select option{background:#1a1a25;color:var(--text)}

/* Options grid */
.options-grid{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.opt-row{display:flex;align-items:center;gap:7px}
.opt-letter{
  width:26px;height:26px;border-radius:6px;flex-shrink:0;
  background:var(--surface2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:0.72rem;font-weight:700;color:var(--text3);
}
.opt-row input[type="text"]{flex:1;padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:0.85rem;outline:none}
.opt-row input:focus{border-color:rgba(99,102,241,0.4)}
.opt-check{cursor:pointer;display:flex;align-items:center}
.opt-check input[type="radio"]{display:none}
.opt-check span{font-size:1rem;opacity:0.2;filter:grayscale(1);transition:all 0.2s}
.opt-check input:checked+span{opacity:1;filter:none;transform:scale(1.2)}

/* Buttons */
.btn{
  width:100%;padding:10px 16px;font-size:0.85rem;font-weight:600;
  border:none;border-radius:var(--radius-sm);cursor:pointer;transition:all 0.2s;
}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-ai{
  background:linear-gradient(135deg,rgba(99,102,241,0.2),rgba(139,92,246,0.2));
  border:1px solid rgba(139,92,246,0.3);color:#c4b5fd;
}
.btn-ai:hover{background:linear-gradient(135deg,rgba(99,102,241,0.3),rgba(139,92,246,0.3));border-color:rgba(139,92,246,0.5)}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text2)}
.btn-outline:hover{background:var(--surface2);color:var(--text)}

/* AI feedback */
#ai-feedback,#add-feedback{font-size:0.78rem;padding:6px 10px;border-radius:6px;margin-top:8px;display:none}
.ai-spinner{width:24px;height:24px;margin:0 auto;border:2px solid rgba(99,102,241,0.15);border-top-color:#6366f1;border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── QUESTIONS LIST ─────────────────────────────────── */
.q-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.q-count-badge{
  font-size:0.72rem;font-weight:700;
  background:var(--surface2);border:1px solid var(--border);
  padding:3px 10px;border-radius:99px;color:var(--text2);
}
.q-list{display:flex;flex-direction:column;gap:6px}
.q-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:12px 14px;background:var(--surface2);
  border:1px solid var(--border);border-radius:var(--radius-sm);
  transition:border-color 0.2s;
}
.q-item:hover{border-color:var(--border2)}
.q-num{
  font-size:0.65rem;font-weight:700;color:var(--text3);
  min-width:24px;padding-top:2px;
}
.q-body{flex:1;min-width:0}
.q-text{font-size:0.85rem;font-weight:500;color:var(--text);margin-bottom:6px;line-height:1.5}
.q-opts{display:flex;flex-wrap:wrap;gap:4px}
.q-opt{font-size:0.72rem;padding:2px 8px;border-radius:4px;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text3)}
.q-opt.correct{background:var(--green-soft);border-color:rgba(34,197,94,0.2);color:var(--green);font-weight:600}
.q-del{
  padding:6px 8px;background:transparent;border:1px solid transparent;
  border-radius:6px;color:var(--text3);font-size:0.8rem;cursor:pointer;transition:all 0.2s;flex-shrink:0;
}
.q-del:hover{background:var(--red-soft);border-color:rgba(239,68,68,0.2);color:var(--red)}

.empty-state{
  text-align:center;padding:32px;color:var(--text3);font-size:0.85rem;
  border:1px dashed var(--border);border-radius:var(--radius-sm);
}

@media(max-width:600px){
  .main{padding:16px}
  .topbar{padding:0 16px}
  .stats-row{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<!-- ── PIN LOGIN ─────────────────────────── -->
<div id="login-page">
  <div class="login-card">
    <div class="login-logo">Pro<span>Web</span> <span class="topbar-badge">Admin</span></div>
    <div class="pin-dots">
      <div class="pin-dot" id="d0"></div>
      <div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div>
      <div class="pin-dot" id="d3"></div>
    </div>
    <div class="pin-grid">
      <button class="pin-btn" data-k="1">1</button>
      <button class="pin-btn" data-k="2">2</button>
      <button class="pin-btn" data-k="3">3</button>
      <button class="pin-btn" data-k="4">4</button>
      <button class="pin-btn" data-k="5">5</button>
      <button class="pin-btn" data-k="6">6</button>
      <button class="pin-btn" data-k="7">7</button>
      <button class="pin-btn" data-k="8">8</button>
      <button class="pin-btn" data-k="9">9</button>
      <button class="pin-btn pin-del" data-k="del">⌫</button>
      <button class="pin-btn" data-k="0">0</button>
      <button class="pin-btn pin-ok" data-k="ok">→</button>
    </div>
    <div id="pin-error"></div>
  </div>
</div>

<!-- ── MAIN APP ──────────────────────────── -->
<div id="app">

  <!-- Topbar -->
  <div class="topbar">
    <div style="display:flex;align-items:center">
      <span class="topbar-logo">Pro<span>Web</span></span>
      <span class="topbar-badge">Admin</span>
    </div>
    <div class="topbar-right">
      <a href="index.html" class="btn-sm">← Saytga qaytish</a>
      <button class="btn-sm btn-danger-sm" id="logout-btn">Chiqish</button>
    </div>
  </div>

  <div class="main">

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Jami savollar</div>
        <div class="stat-value accent" id="stat-total">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Faol fanlar</div>
        <div class="stat-value" id="stat-subjects">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Joriy blok</div>
        <div class="stat-value" id="stat-block">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Til</div>
        <div class="stat-value" id="stat-lang">UZ</div>
      </div>
    </div>

    <!-- Til tanlash -->
    <div class="card">
      <div class="card-title">Til</div>
      <div class="lang-tabs">
        <button class="lang-tab active" data-lang="uz">🇺🇿 O'zbekcha</button>
        <button class="lang-tab" data-lang="ru">🇷🇺 Русский</button>
      </div>
    </div>

    <!-- Fan tanlash -->
    <div class="card">
      <div class="card-title">Fan tanlash</div>
      <div class="subject-grid" id="subject-grid"></div>
    </div>

    <!-- Blok tanlash -->
    <div class="card" id="block-card" style="display:none">
      <div class="card-title">Blok</div>
      <div class="block-tabs" id="block-tabs"></div>
      <div class="block-config">
        <label>Bloklar soni:</label>
        <input type="number" id="block-count" value="1" min="1" max="20">
        <button class="btn-sm" onclick="saveBlockCount()" style="padding:6px 12px;font-size:0.75rem">Saqlash</button>
      </div>
    </div>

    <!-- Savollar qo'shish -->
    <div id="editor-section" style="display:none">
      <div class="two-col">

        <!-- AI generator -->
        <div class="card">
          <div class="card-title">🤖 AI bilan savol yaratish</div>
          <div class="form-field">
            <label>Mavzu</label>
            <input type="text" id="ai-topic" placeholder="Masalan: Python funksiyalar">
          </div>
          <div class="form-field">
            <label>Savollar soni</label>
            <select id="ai-count">
              <option value="3">3 ta</option>
              <option value="5" selected>5 ta</option>
              <option value="10">10 ta</option>
            </select>
          </div>
          <button class="btn btn-ai" id="ai-generate-btn" onclick="generateAIQuestions()">🤖 Generatsiya qilish</button>
          <div id="ai-loading" style="display:none;text-align:center;padding:16px">
            <div class="ai-spinner"></div>
            <p style="font-size:0.78rem;color:var(--text3);margin-top:8px">Savollar tayyorlanmoqda...</p>
          </div>
          <div id="ai-feedback"></div>
        </div>

        <!-- Qo'lda qo'shish -->
        <div class="card">
          <div class="card-title">✍️ Qo'lda qo'shish</div>
          <div class="form-field">
            <label>Savol matni</label>
            <textarea id="q-text" rows="2" placeholder="Savolni yozing..."></textarea>
          </div>
          <div class="options-grid">
            <div class="opt-row"><span class="opt-letter">A</span><input type="text" id="opt-0" placeholder="A variant"><label class="opt-check"><input type="radio" name="ca" value="0" checked><span>✅</span></label></div>
            <div class="opt-row"><span class="opt-letter">B</span><input type="text" id="opt-1" placeholder="B variant"><label class="opt-check"><input type="radio" name="ca" value="1"><span>✅</span></label></div>
            <div class="opt-row"><span class="opt-letter">C</span><input type="text" id="opt-2" placeholder="C variant"><label class="opt-check"><input type="radio" name="ca" value="2"><span>✅</span></label></div>
            <div class="opt-row"><span class="opt-letter">D</span><input type="text" id="opt-3" placeholder="D variant"><label class="opt-check"><input type="radio" name="ca" value="3"><span>✅</span></label></div>
          </div>
          <button class="btn btn-primary" onclick="addQuestion()">+ Savol qo'shish</button>
          <div id="add-feedback"></div>
        </div>

      </div>

      <!-- Savollar ro'yxati -->
      <div class="card">
        <div class="q-header">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:0.72rem;font-weight:700;color:var(--text3);letter-spacing:0.5px;text-transform:uppercase">Savollar</span>
            <span class="q-count-badge"><span id="q-count">0</span> ta</span>
          </div>
          <button class="btn-sm btn-danger-sm" id="clear-btn" onclick="clearAll()">🗑 Blokni tozalash</button>
        </div>
        <div id="q-list"><div class="empty-state">👆 Yuqoridan fan va blok tanlang</div></div>
      </div>
    </div>

  </div>
</div>

<script src="questions_seed.js"></script>
<script src="questions_supabase.js"></script>
<script src="admin.js"></script>
<script>
// ── PIN ──────────────────────────────────────────────
const ADMIN_PIN_CODE = '7070';
let pin = '';

function updateDots() {
  for(let i=0;i<4;i++) document.getElementById('d'+i).classList.toggle('filled', i < pin.length);
}
function checkPin() {
  if(pin === ADMIN_PIN_CODE) {
    sessionStorage.setItem('adminOk','1');
    document.getElementById('login-page').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initApp();
  } else {
    document.getElementById('pin-error').textContent = 'Noto\'g\'ri PIN';
    document.querySelectorAll('.pin-dot').forEach(d => {
      d.classList.add('shake');
      setTimeout(()=>d.classList.remove('shake'),400);
    });
    pin = '';
    updateDots();
  }
}
document.querySelectorAll('.pin-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const k = btn.dataset.k;
    if(k === 'del') pin = pin.slice(0,-1);
    else if(k === 'ok') checkPin();
    else if(pin.length < 4) pin += k;
    updateDots();
    if(pin.length === 4 && k !== 'ok') setTimeout(checkPin, 200);
    document.getElementById('pin-error').textContent = '';
  });
});
document.addEventListener('keydown', e => {
  if(document.getElementById('app').style.display === 'block') return;
  if(e.key >= '0' && e.key <= '9' && pin.length < 4) { pin += e.key; updateDots(); if(pin.length===4) setTimeout(checkPin,200); }
  else if(e.key === 'Backspace') { pin=pin.slice(0,-1); updateDots(); }
  else if(e.key === 'Enter') checkPin();
});
if(sessionStorage.getItem('adminOk')==='1') {
  document.getElementById('login-page').style.display='none';
  document.getElementById('app').style.display='block';
  document.addEventListener('DOMContentLoaded', initApp);
}
document.getElementById('logout-btn').addEventListener('click', () => {
  sessionStorage.removeItem('adminOk');
  location.reload();
});
</script>
</body>
</html>
