<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test | ProWeb</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="" alt="Subject" id="selected-subject-logo" style="height: 40px; display: none;">
        </div>
        <div class="header-links">
            <a href="index.html" id="back-link">Orqaga</a>
        </div>
    </header>

    <main>
        <h1 class="page-title" id="subject-title">Test</h1>
        
        <div class="form-container" id="user-info-form">
            <div style="text-align:center; margin-bottom:28px;">
                <img id="form-subject-logo" src="" alt="" style="height:52px;object-fit:contain;display:none;margin-bottom:12px;">
                <h2 id="form-subject-name" style="font-size:1.15rem;font-weight:700;color:rgba(255,255,255,0.85);"></h2>
            </div>

            <div class="form-group">
                <label id="label-name">Ism va Familiya</label>
                <input id="user-name" type="text" placeholder="Sardor Rahimov"
                       autocomplete="name" autocorrect="off" spellcheck="false"
                       style="width:100%;font-size:1rem;">
            </div>

            <div class="form-group">
                <label id="label-phone">Telefon raqam</label>
                <input id="user-phone" type="tel" placeholder="+998 90 123 45 67"
                       autocomplete="tel" style="width:100%;font-size:1rem;">
            </div>

            <button id="start-test-btn" onclick="startTest()" class="btn" style="margin-top:4px;">
                Testni boshlash →
            </button>

            <p id="form-error" style="color:#ff6060;font-size:0.82rem;display:none;margin-top:12px;text-align:center;"></p>
        </div>

        <div class="form-container" id="test-container" style="display: none; position: relative;">
            <div id="timer-display" style="position: absolute; top: 20px; right: 20px; font-size: 1.5rem; font-weight: bold; color: #ff3333;">15</div>
            
            <form id="quiz-form">
                <div id="single-question-wrapper" style="margin-top: 40px;">
                    <!-- Question will be injected here -->
                </div>
                
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="button" class="btn" id="next-q-btn" style="flex: 1;">Keyingi (O'tkazish)</button>
                    <button type="button" class="btn" id="finish-early-btn" style="flex: 1; background-color: #ff3333; color: white;">Testni yakunlash</button>
                </div>
            </form>
        </div>

        <div class="form-container result-container" id="result-container" style="display:none; text-align:center;">
            <div style="font-size:3rem; margin-bottom:20px;">✅</div>
            <h2 id="result-title" style="font-size:1.5rem; font-weight:800; margin-bottom:16px;">Test Yakunlandi</h2>
            <p id="result-message" style="font-size:1rem; color:rgba(255,255,255,0.5); line-height:1.7; margin-bottom:32px;">
                Testda qatnashganizga tashakkur,<br>sizga aloqaga chiqamiz.
            </p>
            <a href="index.html" class="btn" id="home-btn">Bosh sahifaga qaytish</a>
        </div>
    </main>

    <script src="questions_seed.js"></script>
    <script src="questions_supabase.js"></script>
    <script src="script.js"></script>
</body>
</html>
