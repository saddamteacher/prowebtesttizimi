<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test | ProWeb</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="" alt="Subject" id="selected-subject-logo" style="height: 40px; display: none;">
        </div>
        <div class="header-links">
            <a href="index.html" id="back-link">Orqaga</a>
        </div>
    </header>

    <main>
        <h1 class="page-title" id="subject-title">Test</h1>
        
        <div class="form-container" id="user-info-form">
            <div id="telegram-login-section" style="text-align: center;">
                <p style="color: #888; font-size: 0.9rem; margin-bottom: 18px;" data-uz="Davom etish uchun Telegram orqali kiring:" data-ru="Войдите через Telegram чтобы продолжить:">Davom etish uchun Telegram orqali kiring:</p>
                <div id="telegram-login-btn" style="display: flex; justify-content: center;">
                    <script async src="https://telegram.org/js/telegram-widget.js?22" 
                        data-telegram-login="prowebloginbot" 
                        data-size="large" 
                        data-userpic="true"
                        data-radius="14"
                        data-onauth="onTelegramAuth(user)"
                        data-request-access="write">
                    </script>
                </div>
                <p id="telegram-status" style="margin-top: 12px; font-size: 0.85rem; color: #4ade80; display: none;"></p>
            </div>
        </div>

        <div class="form-container" id="test-container" style="display: none; position: relative;">
            <div id="timer-display" style="position: absolute; top: 20px; right: 20px; font-size: 1.5rem; font-weight: bold; color: #ff3333;">15</div>
            
            <form id="quiz-form">
                <div id="single-question-wrapper" style="margin-top: 40px;">
                    <!-- Question will be injected here -->
                </div>
                
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="button" class="btn" id="next-q-btn" style="flex: 1;">Keyingi (O'tkazish)</button>
                    <button type="button" class="btn" id="finish-early-btn" style="flex: 1; background-color: #ff3333; color: white;">Testni yakunlash</button>
                </div>
            </form>
        </div>

        <div class="form-container result-container" id="result-container" style="display: none;">
            <h2 id="result-title">✅ Test Yakunlandi</h2>
            <p id="result-message" style="margin-top: 20px; margin-bottom: 30px; font-size: 1.2rem;">Qatnashganingiz uchun rahmat!<br>Siz bilan tez orada bog'lanamiz.</p>
            <a href="index.html" class="btn" id="home-btn">Bosh sahifaga qaytish</a>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
